name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker images
        run: |
          # Build application image
          docker build -t cbiu-website:latest .
          docker save cbiu-website:latest -o cbiu-website.tar
          chmod 644 cbiu-website.tar
          
          # Pull and save MySQL image (to avoid network issues on server)
          docker pull mysql:8.0
          docker save mysql:8.0 -o mysql.tar
          chmod 644 mysql.tar
          
          # 拉取并保存 MinIO 镜像（使用旧版本，包含完整控制台功能）
          docker pull minio/minio:RELEASE.2025-04-22T22-12-26Z
          docker save minio/minio:RELEASE.2025-04-22T22-12-26Z -o minio.tar
          chmod 644 minio.tar
      
      - name: Upload files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "cbiu-website.tar,mysql.tar,minio.tar,docker-compose.yml"
          target: "/var/www/cbiu-website/"
      
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e  # Exit on error
            cd /var/www/cbiu-website/
            # 尝试更改所有权为当前用户（便于管理）
            chown -R $USER:$USER /var/www/cbiu-website || true
            chmod -R 755 /var/www/cbiu-website

            # ----------------------------------------------------
            #  关键修复: 处理 uploads 目录权限 (解决 EACCES 错误)
            # ----------------------------------------------------
            # 1. 确保 uploads 目录存在 (宿主机)
            mkdir -p /var/www/cbiu-website/uploads
            
            # 2. 将 uploads 设为 UID 1001 (容器内的 nextjs 用户)
            # 只有 root (或 sudo) 才能执行 chown 为其他 UID
            # 如果您当前是普通用户，可能需要 sudo
            echo "🔧 Fixing uploads directory permissions..."
            chown -R 1001:1001 /var/www/cbiu-website/uploads || echo "⚠️ Warning: Failed to chown uploads to 1001 (Non-root user?)"
            
            # 3. 检查 .env 文件是否存在         # (可选) 确保 www-data 可以访问
            # chown -R www-data:www-data /var/www/cbiu-website
            
            echo "📦 Step 1: Checking tar files..."
            ls -lh cbiu-website.tar mysql.tar minio.tar
            
            echo ""
            echo "🛑 Step 2: Stopping containers..."
            docker-compose down || true
            
            echo ""
            echo "🗑️  Step 3: Removing old cbiu-website image..."
            docker rmi -f cbiu-website:latest || echo "No old image to remove"
            
            echo ""
            echo "📥 Step 4: Loading new images..."
            docker load -i mysql.tar
            docker load -i cbiu-website.tar
            docker load -i minio.tar
            
            echo ""
            echo "🔍 Step 5: Verifying loaded images..."
            docker images | grep -E "cbiu-website|mysql|minio"
            
            echo ""
            echo "📝 Step 6: docker-compose.yml synced from repository"
            ls -lh docker-compose.yml
            
            echo ""
            echo "🚀 Step 7: Starting services..."
            docker-compose up -d

            echo ""
            echo "🔍 Step 8: Checking container status..."
            docker ps
            
            echo ""
            echo "🧹 Step 9: Cleanup..."
            docker image prune -f
            rm cbiu-website.tar mysql.tar minio.tar
            
            echo ""
            echo "✅ Deployment completed successfully!"
            echo "📊 Final status:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
