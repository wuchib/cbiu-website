name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker images
        run: |
          # Build application image
          docker build -t cbiu-website:latest .
          docker save cbiu-website:latest -o cbiu-website.tar
          chmod 644 cbiu-website.tar
          
          # Pull and save MySQL image (to avoid network issues on server)
          docker pull mysql:8.0
          docker save mysql:8.0 -o mysql.tar
          chmod 644 mysql.tar
      
      - name: Upload files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "cbiu-website.tar,mysql.tar,docker-compose.yml"
          target: "/var/www/cbiu-website/"
      
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e  # Exit on error
            # 确保目标目录存在
            mkdir -p /var/www/cbiu-website
            cd /var/www/cbiu-website
            
            # (可选) 确保 www-data 可以访问
            # chown -R www-data:www-data /var/www/cbiu-website
            
            echo "📦 Step 1: Checking tar files..."
            ls -lh cbiu-website.tar mysql.tar
            
            echo ""
            echo "🛑 Step 2: Stopping containers..."
            docker-compose down || true
            
            echo ""
            echo "🗑️  Step 3: Removing old cbiu-website image..."
            docker rmi -f cbiu-website:latest || echo "No old image to remove"
            
            echo ""
            echo "📥 Step 4: Loading new images..."
            docker load -i mysql.tar
            docker load -i cbiu-website.tar
            
            echo ""
            echo "🔍 Step 5: Verifying loaded images..."
            docker images | grep -E "cbiu-website|mysql"
            
            echo ""
            echo "📝 Step 6: docker-compose.yml synced from repository"
            ls -lh docker-compose.yml
            
            echo ""
            echo "🚀 Step 7: Starting services..."
            docker-compose up -d

            echo ""
            echo "🔍 Step 8: Checking container status..."
            docker ps
            
            echo ""
            echo "🧹 Step 9: Cleanup..."
            docker image prune -f
            rm cbiu-website.tar mysql.tar
            
            echo ""
            echo "✅ Deployment completed successfully!"
            echo "📊 Final status:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
