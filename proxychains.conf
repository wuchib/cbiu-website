strict_chain
# Don't proxy DNS for local addresses
#proxy_dns
tcp_read_time_out 15000
tcp_connect_time_out 8000

# Exclude localhost and local networks from proxying
# This is critical for database connections
localnet 127.0.0.0/255.0.0.0
localnet ::1/128
# Exclude Docker internal networks (for database access)
localnet 172.17.0.0/255.255.0.0
localnet 172.18.0.0/255.255.0.0

[ProxyList]
# V2Ray HTTP proxy on host machine
http 127.0.0.1 10808
