version: '3' # Docker Compose 文件版本

services:
  # 定义我们要启动的服务（容器）
  app:
    # 服务名称：应用本身
    container_name: cbiu-website # 容器名称，方便查看日志和管理
    image: cbiu-website:latest # 使用已构建的镜像（由 GitHub Actions 构建并上传）
    restart: always # 重启策略：无论什么原因退出，都自动重启
    network_mode: "host" # 使用宿主机网络，解决容器网络连接问题
    environment:
      # 环境变量配置
      # 数据库连接地址，格式：mysql://用户名:密码@主机:端口/数据库名
      # 注意：使用 host network 模式，数据库通过 localhost:3306 访问
      - DATABASE_URL=${DATABASE_URL:-mysql://root:123456@localhost:3306/cbiu_webside}
      # NextAuth 的密钥和 URL
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=https://cbiu.fun
      # Google OAuth 配置
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # 代理配置 - 通过本地 V2Ray 代理访问 Google (绕过 GFW)
      - HTTP_PROXY=http://127.0.0.1:10808
      - HTTPS_PROXY=http://127.0.0.1:10808
      - NO_PROXY=localhost,127.0.0.1,db,172.17.0.1,172.18.0.1,172.17.0.0/16,172.18.0.0/16
    volumes:
      - ./uploads:/app/public/uploads

  db:
    # 服务名称：数据库
    container_name: cbiu-db
    image: mysql:8.0 # 使用官方的 MySQL 8.0 镜像
    restart: always
    ports:
      - "3306:3306" # 暴露端口到宿主机，让 host network 模式的 app 可以访问
    # 使用原生密码认证插件，防止部分客户端连接报错
    command: --default-authentication-plugin=mysql_native_password
    environment:
      # MySQL root 用户密码
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      # 容器启动时默认创建的数据库名
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cbiu_webside}
    volumes:
      # 数据卷配置（非常重要！）
      # 将容器内的 /var/lib/mysql 映射到宿主机的 db-data 卷
      # 这样即使删除了容器，数据也不会丢失
      - db-data:/var/lib/mysql
    networks:
      - cbiu-network

networks:
  # 定义网络
  cbiu-network:
    driver: bridge # 使用桥接网络，容器之间可以通过服务名互相访问
    enable_ipv6: false # 禁用 IPv6 以避免连接问题

volumes:
  # 定义数据卷
  db-data: # 声明一个具名数据卷，用于持久化数据库数据
